# Builds an Android app (APK) from the zip file you upload to this repository.
# Keep this repository private so the release signing key can be saved for future updates.
#
# How to use:
#   1. Keep this file at .github/workflows/build-apk.yml
#   2. Upload your app zip (it must contain index.html) anywhere in the repo.
#   3. Wait for the green tick in the Actions tab (about 5 minutes).
#   4. Download: https://github.com/<you>/<repo>/releases/latest/download/Anand.apk
#
# Shared library: add two repository variables (Settings > Secrets and variables > Actions > Variables):
#   SUPABASE_URL  your Supabase Project URL
#   SUPABASE_KEY  your Supabase publishable key
# Every APK built here then shares the same songs and playlists.
#
# Uploading a new zip builds a new version. It installs over the old one and keeps your songs,
# because every build is signed with the same key (saved in signing/ on the first build).
# Keep the repository PRIVATE so that key stays private.

name: Build Android app

on:
  push:
    paths:
      - '**.zip'
      - 'index.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

env:
  APP_NAME: Anand              # name under the app icon, and the APK file name
  APP_ID: com.mixtape.player   # Android app id; changing it later installs a separate app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and unzip your app
        id: web
        run: |
          set -euo pipefail
          ZIP=""
          while IFS= read -r f; do
            ts=$(git log -1 --format=%ct -- "$f" || echo 0)
            echo "$ts $f"
          done < <(git ls-files '*.zip' '**/*.zip') | sort -rn > "$RUNNER_TEMP/zips.txt" || true
          ZIP=$(head -n1 "$RUNNER_TEMP/zips.txt" | cut -d' ' -f2- || true)
          if [ -z "$ZIP" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "### Upload your app zip to this repository to build the APK." >> "$GITHUB_STEP_SUMMARY"
            echo "No zip file yet. Upload your app zip and this will run again."
            exit 0
          fi
          echo "Using $ZIP"
          rm -rf "$RUNNER_TEMP/web_src" && mkdir -p "$RUNNER_TEMP/web_src"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/web_src"
          IDX=$(find "$RUNNER_TEMP/web_src" -name index.html -not -path '*/__MACOSX/*' | awk '{ print length($0) " " $0 }' | sort -n | head -n1 | cut -d' ' -f2-)
          if [ -z "$IDX" ]; then
            echo "::error::The zip $ZIP has no index.html inside, so there is no app to build."
            exit 1
          fi
          WEB=$(dirname "$IDX")
          rm -rf web && mkdir web && cp -R "$WEB"/. web/
          rm -rf web/__MACOSX
          # The root index.html is the maintained app source; overlay it onto the uploaded bundle.
          if [ -f index.html ]; then cp index.html web/index.html; fi
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Validate app JavaScript
        if: steps.web.outputs.found == 'true'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('web/index.html', 'utf8');
          const blocks = [...html.matchAll(/<script\\b([^>]*)>([\\s\\S]*?)<\\/script>/gi)];
          let checked = 0;
          for (const block of blocks) {
            if (/\\bsrc\\s*=/.test(block[1])) continue;
            new Function(block[2]);
            checked++;
          }
          if (!checked) throw new Error('No inline app script found');
          console.log('JavaScript syntax valid (' + checked + ' inline script block(s)).');
          NODE


          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Add your shared library settings
        if: steps.web.outputs.found == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          url = (os.environ.get('SUPABASE_URL') or '').strip().rstrip('/')
          key = (os.environ.get('SUPABASE_KEY') or '').strip()
          with open('web/config.js', 'w') as f:
              f.write('window.MIXTAPE_CONFIG = ' + json.dumps({'supabaseUrl': url, 'supabaseKey': key}) + ';\n')
          if url and key:
              print('Shared library connected: ' + url)
          else:
              print('::warning::No shared library set. Add SUPABASE_URL and SUPABASE_KEY under Settings > Secrets and variables > Actions > Variables, then run this again.')
          PY

      - name: Set up Java and Gradle
        if: steps.web.outputs.found == 'true'
        run: |
          set -euo pipefail
          if [ -n "${JAVA_HOME_17_X64:-}" ]; then echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"; fi
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Create the Android project
        if: steps.web.outputs.found == 'true'
        run: |
          set -euo pipefail
          A=android
          M=$A/app/src/main
          J=$M/java/com/mixtape/player
          R=$M/res
          rm -rf $A
          mkdir -p $J $M/assets/www $R/values $R/values-night $R/values-v27 $R/values-night-v27 $R/drawable $R/mipmap-xxxhdpi $R/mipmap-anydpi-v26
          cp -R web/. $M/assets/www/
          echo "sdk.dir=$ANDROID_HOME" > $A/local.properties

          cat > $A/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'Anand'
          include ':app'
          EOF

          cat > $A/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > $A/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > $A/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          def buildNumber = System.getenv('VERSION_CODE') ?: '1'

          android {
              namespace 'com.mixtape.player'
              compileSdk 35

              defaultConfig {
                  applicationId(System.getenv('APP_ID') ?: 'com.mixtape.player')
                  minSdk 24
                  targetSdk 34
                  versionCode(Integer.parseInt(buildNumber))
                  versionName('1.' + buildNumber)
              }

              signingConfigs {
                  release {
                      storeFile(file(System.getenv('KEYSTORE_PATH')))
                      storePassword(System.getenv('KEYSTORE_PASSWORD'))
                      keyAlias('mixtape')
                      keyPassword(System.getenv('KEYSTORE_PASSWORD'))
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > $M/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density|fontScale"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".PlaybackService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          EOF

          cat > $J/MainActivity.java <<'EOF'
          package com.mixtape.player;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              // The app files are packed inside the APK and served from this address, so everything works offline.
              private static final String HOST = "appassets.androidplatform.net";
              private static final String START_URL = "https://" + HOST + "/assets/www/index.html";
              private static final int PICK_SONGS = 41;
              private static final int ASK_NOTIFICATIONS = 42;

              private WebView web;
              private ValueCallback<Uri[]> filePicked;
              private final Handler main = new Handler(Looper.getMainLooper());
              private boolean serviceRunning = false;
              private boolean askedNotifications = false;

              private final Runnable stopPlaybackLater = new Runnable() {
                  @Override
                  public void run() {
                      stopService(new Intent(MainActivity.this, PlaybackService.class));
                      serviceRunning = false;
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  setContentView(web);

                  final WebViewAssetLoader assets = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(true);

                  web.addJavascriptInterface(new Bridge(), "MixtapeAndroid");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assets.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri url = request.getUrl();
                          if (HOST.equals(url.getHost())) return false;
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, url));
                          } catch (Exception ignored) {
                          }
                          return true;
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePicked != null) filePicked.onReceiveValue(null);
                          filePicked = callback;
                          Intent pick = new Intent(Intent.ACTION_GET_CONTENT);
                          pick.addCategory(Intent.CATEGORY_OPENABLE);
                          pick.setType("audio/*");
                          pick.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          try {
                              startActivityForResult(Intent.createChooser(pick, "Choose songs"), PICK_SONGS);
                          } catch (Exception e) {
                              filePicked = null;
                              callback.onReceiveValue(null);
                          }
                          return true;
                      }
                  });

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl(START_URL);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (web != null) web.saveState(outState);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == PICK_SONGS) {
                      Uri[] result = null;
                      if (resultCode == RESULT_OK && data != null) {
                          ClipData clip = data.getClipData();
                          if (clip != null) {
                              result = new Uri[clip.getItemCount()];
                              for (int i = 0; i < clip.getItemCount(); i++) result[i] = clip.getItemAt(i).getUri();
                          } else if (data.getData() != null) {
                              result = new Uri[]{data.getData()};
                          }
                      }
                      if (filePicked != null) filePicked.onReceiveValue(result);
                      filePicked = null;
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              // Back closes the open panel first; on the main screen it sends the app to the background so music keeps playing.
              @Override
              public void onBackPressed() {
                  web.evaluateJavascript("(window.mixtapeBack && window.mixtapeBack()) ? 'yes' : 'no'", new ValueCallback<String>() {
                      @Override
                      public void onReceiveValue(String value) {
                          if (value == null || !value.contains("yes")) moveTaskToBack(true);
                      }
                  });
              }

              @Override
              protected void onDestroy() {
                  main.removeCallbacks(stopPlaybackLater);
                  stopService(new Intent(this, PlaybackService.class));
                  if (web != null) web.destroy();
                  super.onDestroy();
              }

              private void handlePlayback(boolean playing, String title, String artist) {
                  main.removeCallbacks(stopPlaybackLater);
                  if (!playing) {
                      // Wait a moment: between songs the player pauses briefly, and the service must stay on.
                      main.postDelayed(stopPlaybackLater, 5000);
                      return;
                  }
                  if (!askedNotifications && Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      askedNotifications = true;
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, ASK_NOTIFICATIONS);
                  }
                  if (serviceRunning) {
                      PlaybackService.show(this, title, artist);
                      return;
                  }
                  Intent start = new Intent(this, PlaybackService.class);
                  start.putExtra("title", title);
                  start.putExtra("artist", artist);
                  try {
                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(start);
                      else startService(start);
                      serviceRunning = true;
                  } catch (Exception e) {
                      serviceRunning = false;
                  }
              }

              public class Bridge {
                  @JavascriptInterface
                  public void onPlayback(final boolean playing, final String title, final String artist) {
                      main.post(new Runnable() {
                          @Override
                          public void run() {
                              handlePlayback(playing, title, artist);
                          }
                      });
                  }
              }
          }
          EOF

          cat > $J/PlaybackService.java <<'EOF'
          package com.mixtape.player;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;

          // Keeps the app alive while music plays with the screen off, and shows the current song.
          public class PlaybackService extends Service {
              static final int NOTIFICATION_ID = 7;
              static final String CHANNEL = "playback";

              static Notification build(Context c, String title, String artist) {
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  Notification.Builder b;
                  if (Build.VERSION.SDK_INT >= 26) {
                      if (nm.getNotificationChannel(CHANNEL) == null) {
                          NotificationChannel ch = new NotificationChannel(CHANNEL, "Now playing", NotificationManager.IMPORTANCE_LOW);
                          ch.setShowBadge(false);
                          nm.createNotificationChannel(ch);
                      }
                      b = new Notification.Builder(c, CHANNEL);
                  } else {
                      b = new Notification.Builder(c);
                  }
                  Intent open = new Intent(c, MainActivity.class);
                  open.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                  PendingIntent tap = PendingIntent.getActivity(c, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  b.setSmallIcon(R.drawable.ic_stat_music)
                          .setContentTitle(title == null || title.isEmpty() ? c.getString(R.string.app_name) : title)
                          .setContentText(artist == null || artist.isEmpty() ? "Playing" : artist)
                          .setContentIntent(tap)
                          .setOngoing(true)
                          .setOnlyAlertOnce(true)
                          .setShowWhen(false);
                  return b.build();
              }

              static void show(Context c, String title, String artist) {
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.notify(NOTIFICATION_ID, build(c, title, artist));
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String title = intent != null ? intent.getStringExtra("title") : null;
                  String artist = intent != null ? intent.getStringExtra("artist") : null;
                  Notification n = build(this, title, artist);
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(NOTIFICATION_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                  } else {
                      startForeground(NOTIFICATION_ID, n);
                  }
                  return START_NOT_STICKY;
              }

              @Override
              public void onDestroy() {
                  stopForeground(true);
                  super.onDestroy();
              }
          }
          EOF

          cat > $R/drawable/ic_stat_music.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M12,3v10.55c-0.59,-0.34 -1.27,-0.55 -2,-0.55c-2.21,0 -4,1.79 -4,4s1.79,4 4,4s4,-1.79 4,-4V7h4V3h-6z" />
          </vector>
          EOF

          cat > $R/values/colors.xml <<'EOF'
          <resources>
              <color name="app_bg">#F2F1EC</color>
              <color name="icon_bg">#2C47F5</color>
          </resources>
          EOF
          cat > $R/values-night/colors.xml <<'EOF'
          <resources>
              <color name="app_bg">#101115</color>
          </resources>
          EOF

          cat > $R/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@color/app_bg</item>
                  <item name="android:statusBarColor">@color/app_bg</item>
                  <item name="android:navigationBarColor">#FF16171B</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF
          cat > $R/values-night/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/app_bg</item>
                  <item name="android:statusBarColor">@color/app_bg</item>
                  <item name="android:navigationBarColor">@color/app_bg</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF
          cat > $R/values-v27/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@color/app_bg</item>
                  <item name="android:statusBarColor">@color/app_bg</item>
                  <item name="android:navigationBarColor">@color/app_bg</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
          </resources>
          EOF
          cat > $R/values-night-v27/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/app_bg</item>
                  <item name="android:statusBarColor">@color/app_bg</item>
                  <item name="android:navigationBarColor">@color/app_bg</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>
          </resources>
          EOF

          python3 - <<'PY'
          import os, html, json
          name = (os.environ.get('APP_NAME') or 'Anand').strip() or 'Anand'
          safe = html.escape(name, quote=False).replace("'", "\\'").replace('"', '\\"')
          with open('android/app/src/main/res/values/strings.xml', 'w') as f:
              f.write('<resources>\n    <string name="app_name">%s</string>\n</resources>\n' % safe)
          PY

          # App icon: use the icons from your zip, or a plain blue square if there are none.
          ICON=""
          for c in icons/icon-512.png icons/icon-192.png icon-512.png icon.png; do
            if [ -f "web/$c" ]; then ICON="web/$c"; break; fi
          done
          if [ -n "$ICON" ]; then
            cp "$ICON" $R/mipmap-xxxhdpi/ic_launcher.png
          else
            python3 - <<'PY'
          import zlib, struct
          w = h = 192
          raw = b''.join(b'\x00' + bytes((44, 71, 245)) * w for _ in range(h))
          def chunk(t, d):
              return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          open('android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png', 'wb').write(png)
          PY
          fi
          if [ -f web/icons/maskable-512.png ]; then
            cp web/icons/maskable-512.png $R/mipmap-xxxhdpi/ic_launcher_foreground.png
            cat > $R/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_bg" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          fi
          echo "Android project ready."

      - name: Prepare the signing key
        if: steps.web.outputs.found == 'true'
        env:
          SECRET_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          PASS="${SECRET_PASSWORD:-mixtape-release-key}"
          KS="signing/release.keystore"
          if [ -f "$KS" ]; then
            echo "Using the saved signing key, so this version installs over the old one."
          elif [ "$IS_PRIVATE" != "true" ] && [ -z "$SECRET_PASSWORD" ]; then
            echo "::warning::This repository is public, so the signing key was not saved. Make the repository private (Settings > General > Danger Zone > Change visibility) and run this again. Until then, each build needs the old app uninstalled first, which deletes the songs saved in it."
            KS="$RUNNER_TEMP/temp.keystore"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias mixtape -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=${APP_NAME}, O=Personal"
          else
            mkdir -p signing
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias mixtape -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=${APP_NAME}, O=Personal"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$KS"
            git commit -m "Save the app signing key so future builds install as updates"
            BRANCH="${GITHUB_REF_NAME}"
            ok=false
            for i in 1 2 3; do
              if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then ok=true; break; fi
              sleep 5
            done
            if [ "$ok" != "true" ]; then
              echo "::error::Could not save the signing key to the repository. Run the build again."
              exit 1
            fi
            echo "Created and saved a new signing key in $KS."
          fi
          case "$KS" in /*) KP="$KS" ;; *) KP="$GITHUB_WORKSPACE/$KS" ;; esac
          echo "KEYSTORE_PATH=$KP" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Build the APK
        if: steps.web.outputs.found == 'true'
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk "${APP_NAME}.apk"
          ls -la "${APP_NAME}.apk"

      - name: Upload APK as a downloadable artifact
        if: steps.web.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Anand-APK
          path: Anand.apk
          retention-days: 30
      - name: Publish the download
        if: steps.web.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.web.outputs.zip }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          LINK="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${APP_NAME}.apk"
          NOTES=$(printf 'Built from `%s`.\n\nInstall: open this page on your Android phone, tap **%s.apk**, then tap Install. If Android asks, allow installs from this source.\n\nThis version installs over the previous one and keeps your songs.' "$ZIP" "$APP_NAME")
          gh release create "$TAG" "${APP_NAME}.apk" --title "${APP_NAME} build ${GITHUB_RUN_NUMBER}" --notes "$NOTES" --latest --target "$(git rev-parse HEAD)"
          # keep the five newest builds
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | grep '^build-' | xargs -r -n1 gh release delete --cleanup-tag -y || true
          {
            echo "## Your app is ready"
            echo ""
            echo "Download link (always the newest build):"
            echo ""
            echo "$LINK"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Download: $LINK"
